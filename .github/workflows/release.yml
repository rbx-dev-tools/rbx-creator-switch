name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A tag that disagrees with the manifest ships a version nobody can
      # reproduce, so it fails here rather than in someone's browser.
      - name: Verify the tag matches the manifest
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          test "$manifest" = "$tag" || {
            echo "tag $tag does not match manifest version $manifest"
            exit 1
          }

      - run: npm run check

      # Only what the browser loads. The tooling, the tests and the docs are
      # read on GitHub, not installed.
      #
      # Zipped from inside the folder, so manifest.json sits at the root of the
      # archive. A zip with everything one directory down is rejected by the
      # Chrome Web Store and needs an extra click to load unpacked.
      - name: Build the zip
        run: |
          mkdir -p dist
          cp -r manifest.json src icons LICENSE dist/
          cd dist && zip -qr "../rbx-creator-switch-${GITHUB_REF_NAME}.zip" .

      - name: Check the archive is loadable
        run: |
          unzip -l "rbx-creator-switch-${GITHUB_REF_NAME}.zip"
          unzip -l "rbx-creator-switch-${GITHUB_REF_NAME}.zip" | grep -qE ' manifest.json$' || {
            echo 'manifest.json is not at the root of the archive'
            exit 1
          }
          for size in 16 32 48 128; do
            unzip -l "rbx-creator-switch-${GITHUB_REF_NAME}.zip" | grep -qE " icons/icon-$size.png$" || {
              echo "icons/icon-$size.png is missing from the archive"
              exit 1
            }
          done

      - name: Generate SHA256 checksum
        run: sha256sum rbx-creator-switch-*.zip > SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            rbx-creator-switch-*.zip
            SHA256SUMS

      # The Chrome Web Store, through its own API rather than a third-party
      # action: two curl calls, nothing to pin and nothing to trust. It runs
      # only once the repository variable CWS_EXTENSION_ID exists, which is
      # how a release can be cut before the store account is set up. The
      # three secrets come from a Google Cloud OAuth client owned by the
      # same account as the store listing.
      - name: Publish to the Chrome Web Store
        if: vars.CWS_EXTENSION_ID != ''
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$REFRESH_TOKEN" ]; then
            echo 'CWS secrets are not set: the GitHub release is out, the store upload is left to the console.'
            exit 0
          fi
          token=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).access_token")
          test -n "$token" || { echo 'no access token'; exit 1; }

          zip=$(ls rbx-creator-switch-*.zip)
          upload=$(curl -sS -X PUT \
            -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T "$zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "$upload"
          echo "$upload" | grep -q '"uploadState": *"SUCCESS"' || { echo 'upload failed'; exit 1; }

          publish=$(curl -sS -X POST -H "Authorization: Bearer $token" \
            -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          echo "$publish"
          echo "$publish" | grep -q '"status": *\["OK"\]' || { echo 'publish failed'; exit 1; }
