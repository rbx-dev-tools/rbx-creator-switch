name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: Package the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A tag that disagrees with the manifest ships a version nobody can
      # reproduce, so it fails here rather than in someone's browser.
      - name: Verify the tag matches the manifest
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          tag=${GITHUB_REF_NAME#v}
          test "$manifest" = "$tag" || {
            echo "tag $tag does not match manifest version $manifest"
            exit 1
          }

      - run: npm run check

      # Only what the browser loads. The tooling, the tests and the docs are
      # read on GitHub, not installed.
      #
      # Zipped from inside the folder, so manifest.json sits at the root of the
      # archive. A zip with everything one directory down is rejected by the
      # Chrome Web Store and needs an extra click to load unpacked.
      - name: Build the zip
        run: |
          mkdir -p dist
          cp -r manifest.json src icons LICENSE dist/
          cd dist && zip -qr "../rbx-creator-switch-${GITHUB_REF_NAME}.zip" .

      - name: Check the archive is loadable
        run: |
          unzip -l "rbx-creator-switch-${GITHUB_REF_NAME}.zip"
          unzip -l "rbx-creator-switch-${GITHUB_REF_NAME}.zip" | grep -qE ' manifest.json$' || {
            echo 'manifest.json is not at the root of the archive'
            exit 1
          }
          for size in 16 32 48 128; do
            unzip -l "rbx-creator-switch-${GITHUB_REF_NAME}.zip" | grep -qE " icons/icon-$size.png$" || {
              echo "icons/icon-$size.png is missing from the archive"
              exit 1
            }
          done

      - name: Generate SHA256 checksum
        run: sha256sum rbx-creator-switch-*.zip > SHA256SUMS

      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          files: |
            rbx-creator-switch-*.zip
            SHA256SUMS
